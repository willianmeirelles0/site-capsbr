     Google Tag Manager, Meta Pixel ou aviso de cookies (não há rastreamento
     de visita nem anúncio aqui, então não há nada pra consentir). -->

<!-- Animação de boas-vindas (quando a proposta tem nome de cliente) -->
<div class="intro js-intro" hidden aria-hidden="true">
  <div class="intro__in">
    <div class="intro__logo js-intro-logo"></div>
    <p class="intro__hi">Boas-vindas, <b class="js-intro-name"></b></p>
    <p class="intro__sub">Preparamos esta proposta de fórmulas para você.</p>
  </div>
  <span class="intro__skip">Toque para pular</span>
</div>

<main class="pages js-pages" aria-live="polite"><p class="loading" id="propLoading">Carregando a sua proposta…</p></main>

<!-- Botões flutuantes -->
<nav class="dock js-dock" aria-label="Ações da proposta">
  <button type="button" class="dock__pdf js-dock-pdf">
    <svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 1.5v8M3.5 6.5L7 10l3.5-3.5M2 12.5h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Baixar PDF</span>
  </button>
  <a class="dock__wa js-dock-wa" href="https://wa.me/5554997090147" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.5-.3z"/></svg>

  </a>

<div class="toast js-toast" role="status"></div>

<!-- Busca a proposta e injeta o mesmo motor de renderização do catálogo -->
<script>
(async () => {
  const id = new URLSearchParams(location.search).get('id') || '';
  const fail = msg => {
    document.getElementById('propLoading').textContent = msg;
  };
  let doc;
  try {
    const res = await fetch('/api/proposta?id=' + encodeURIComponent(id), { cache: 'no-store' });
    if (!res.ok) return fail('Esta proposta não foi encontrada. Pode ter sido removida — fale com a CapsBR para receber uma nova.');
    doc = await res.json();
  } catch {
    return fail('Não foi possível carregar a proposta agora. Verifique sua conexão e recarregue a página.');
  }
  if (!doc || !Array.isArray(doc.produtos) || !doc.produtos.length) return fail('Esta proposta está vazia.');
  window.__CAPSBR_PROPOSTA__ = doc;
  window.PRODUCTS = doc.produtos;
  window.SITE = {};
  const s = document.createElement('script');
  s.src = 'assets/js/catalog.js?v=20261127a';
  document.body.appendChild(s);
})();
</script>

</body>
